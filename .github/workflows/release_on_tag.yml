# On every pushed tag (e.g. v1.0.0): build EDAA in Release, build the
# Inno Setup installer and attach it (plus a zip with the add-on) to the
# GitHub release of that tag.
name: Release on tag

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          # ReShade, ImGui, the DLSS and XeSS SDKs (shallow, at the pinned commits).
          submodules: true

      # NVIDIA Streamline SDK (DLSS Frame Generation): headers for the build,
      # production DLLs shipped next to the add-on.
      - name: Get Streamline SDK
        shell: pwsh
        run: |
          $url = "https://github.com/NVIDIA-RTX/Streamline/releases/download/v2.14.16/streamline-sdk-v2.14.16.zip"
          Invoke-WebRequest -Uri $url -OutFile sl.zip
          Expand-Archive sl.zip -DestinationPath third_party/streamline -Force

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build add-on
        shell: pwsh
        run: |
          # Quoted: PowerShell would split -DEDAA_VERSION=0.2.0 at the first dot.
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DEDAA_VERSION=${{ steps.version.outputs.version }}"
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} installer\EDAA.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Zip add-on
        shell: pwsh
        run: |
          # Add-on + DLSS library, README, notices and licenses.
          $zip = "installer\Output\zip"
          New-Item -ItemType Directory -Force "$zip\licenses" | Out-Null
          Copy-Item build\Release\EDAA.addon64, build\Release\nvngx_dlss.dll, build\Release\libxess.dll, README.md, LICENSE, THIRD_PARTY_NOTICES.md $zip
          Copy-Item third_party\dlss\LICENSE.txt "$zip\licenses\NVIDIA-RTX-SDKs-LICENSE.txt"
          Copy-Item third_party\reshade\LICENSE.md "$zip\licenses\ReShade-LICENSE.md"
          Copy-Item third_party\imgui\LICENSE.txt "$zip\licenses\ImGui-LICENSE.txt"
          Copy-Item third_party\xess\LICENSE.txt "$zip\licenses\Intel-XeSS-LICENSE.txt"
          Copy-Item third_party\xess\third-party-programs.txt "$zip\licenses\Intel-XeSS-third-party-programs.txt"
          # DLSS Frame Generation (NVIDIA Streamline).
          Copy-Item build\Release\sl.interposer.dll, build\Release\sl.common.dll, build\Release\sl.dlss_g.dll, build\Release\sl.reflex.dll, build\Release\sl.pcl.dll, build\Release\nvngx_dlssg.dll $zip
          Copy-Item third_party\streamline\license.txt "$zip\licenses\NVIDIA-Streamline-LICENSE.txt"
          Copy-Item third_party\streamline\external\ngx-sdk\license.txt "$zip\licenses\NVIDIA-NGX-SDK-LICENSE.txt"
          Compress-Archive -Path "$zip\*" -DestinationPath "installer\Output\EDAA-${{ steps.version.outputs.version }}.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            installer/Output/EDAA-Setup-${{ steps.version.outputs.version }}.exe
            installer/Output/EDAA-${{ steps.version.outputs.version }}.zip
