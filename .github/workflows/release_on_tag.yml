# On every pushed tag (e.g. v1.0.0): build EDAA in Release, build the
# Inno Setup installer and attach it (plus a zip with the add-on) to the
# GitHub release of that tag.
name: Release on tag

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build add-on
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} installer\EDAA.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Zip add-on
        shell: pwsh
        run: |
          Compress-Archive -Path build\Release\EDAA.addon64, README.md -DestinationPath "installer\Output\EDAA-${{ steps.version.outputs.version }}.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: |
            installer/Output/EDAA-Setup-${{ steps.version.outputs.version }}.exe
            installer/Output/EDAA-${{ steps.version.outputs.version }}.zip
